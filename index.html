<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Meetar 私有投放数据仪表盘">
  <title>Meetar 仪表盘</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3f7;
      --paper: #ffffff;
      --ink: #182230;
      --muted: #667085;
      --faint: #98a2b3;
      --line: #d7e0ea;
      --line-strong: #c7d3df;
      --brand: #143f52;
      --blue: #2f7187;
      --blue-soft: #dcecf1;
      --green: #5d937d;
      --green-soft: #e5f0ea;
      --pay-rate: #ff7a1a;
      --pay-rate-soft: #fff0df;
      --red: #c36a61;
      --red-soft: #f5e1de;
      --gold: #b78a43;
      --gold-soft: #f4ead8;
      --violet: #7d6aa7;
      --violet-soft: #ebe7f4;
      --shadow: 0 14px 34px rgba(31, 53, 72, .11);
      --shadow-soft: 0 6px 18px rgba(31, 53, 72, .07);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--bg); }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255,255,255,.74), rgba(255,255,255,0) 300px),
        var(--bg);
      font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.42;
      overflow-x: hidden;
    }
    .skip-link {
      position: fixed; left: 16px; top: 12px; z-index: 20;
      transform: translateY(-140%);
      background: var(--ink); color: var(--paper);
      padding: 8px 12px; border-radius: 6px; text-decoration: none;
    }
    .skip-link:focus { transform: translateY(0); }
    .page { width: min(1500px, 100%); margin: 0 auto; padding: 18px clamp(14px, 2vw, 28px) 34px; }
    .topbar { display: grid; grid-template-columns: minmax(170px, .32fr) minmax(0, 1fr); gap: 22px; align-items: start; margin-bottom: 12px; }
    .masthead { display: grid; gap: 6px; }
    .eyebrow { display: none; }
    h1 {
      margin: 0;
      max-width: 6ch;
      font-size: clamp(28px, 3.1vw, 42px);
      line-height: 1.05;
      letter-spacing: 0;
      font-weight: 800;
      text-wrap: balance;
    }
    .sub { max-width: 56ch; color: var(--muted); font-size: 12px; font-weight: 500; }
    .controls { display: grid; grid-template-columns: repeat(7, minmax(118px, 1fr)); gap: 10px; align-items: end; }
    label {
      display: grid; gap: 5px; min-width: 0;
      color: #66728a; font-size: 12px; font-weight: 700;
    }
    select, input[type="date"] {
      width: 100%; min-height: 38px; appearance: none;
      border: 1px solid var(--line); border-radius: 7px;
      background-color: var(--paper); color: var(--ink);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9), var(--shadow-soft);
      font: inherit; font-size: 13px; font-weight: 650;
      padding: 8px 30px 8px 10px;
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    select {
      background-image:
        linear-gradient(45deg, transparent 50%, #6b7588 50%),
        linear-gradient(135deg, #6b7588 50%, transparent 50%);
      background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    input[type="date"] { padding-right: 9px; }
    select:hover, input[type="date"]:hover { border-color: #b5c3d2; transform: translateY(-1px); }
    select:focus, input[type="date"]:focus { outline: 2px solid rgba(47,113,135,.35); outline-offset: 2px; border-color: var(--blue); }
    .is-hidden { display: none; }
    .board { display: grid; gap: 14px; }
    .section-shell { display: grid; gap: 10px; }
    .section-title {
      display: grid; grid-template-columns: minmax(170px, max-content) minmax(0, 1fr);
      gap: 12px; align-items: baseline; margin-bottom: 10px;
    }
    h2 { margin: 0; font-size: 18px; line-height: 1.2; letter-spacing: 0; font-weight: 800; text-wrap: balance; }
    .caption { min-width: 0; color: var(--muted); font-size: 12px; text-align: right; font-weight: 600; }
    .note {
      margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7;
      border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.72);
      padding: 10px 12px;
    }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: stretch; }
    .metric-card, .roi-stage, .card {
      min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow);
    }
    .metric-card {
      display: grid; grid-template-columns: minmax(0, 1fr) 116px; grid-template-rows: auto auto auto;
      gap: 4px 12px; min-height: 112px; padding: 14px 16px; overflow: hidden;
    }
    .metric-card.bad { background: linear-gradient(180deg, #fff, var(--red-soft)); }
    .metric-card.good { background: linear-gradient(180deg, #fff, var(--green-soft)); }
    .kpi-label { color: var(--muted); font-size: 13px; font-weight: 750; }
    .kpi-value {
      grid-column: 1; align-self: end;
      font-size: clamp(23px, 2.2vw, 31px); line-height: 1.02; font-weight: 800;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .metric-spark { grid-column: 2; grid-row: 1 / 4; align-self: end; width: 100%; height: 54px; }
    .spark-area { fill: var(--blue-soft); }
    .spark-line { fill: none; stroke: var(--blue); stroke-width: 2.2; }
    .spark-line.cost { stroke: var(--blue); }
    .spark-line.goodline { stroke: var(--green); }
    .spark-line.badline { stroke: var(--red); }
    .delta {
      display: flex; align-items: center; gap: 7px; color: var(--muted);
      font-size: 12px; font-variant-numeric: tabular-nums;
    }
    .delta strong { color: var(--ink); font-weight: 800; }
    .delta.bad strong, .metric-bad, .value-label.bad { color: var(--red); fill: var(--red); }
    .delta.good strong, .metric-good, .value-label.good { color: var(--green); fill: var(--green); }
    .roi-icons { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
    .roi-stage { display: grid; gap: 12px; padding: 14px; }
    .roi-stage.bad { background: linear-gradient(180deg, #fff, var(--red-soft)); }
    .roi-stage.good { background: linear-gradient(180deg, #fff, var(--green-soft)); }
    .roi-stage-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-variant-numeric: tabular-nums; }
    .roi-stage-head span { color: var(--muted); font-size: 13px; font-weight: 800; }
    .roi-stage-head strong { font-size: 26px; line-height: 1; font-weight: 800; }
    .roi-track { height: 8px; border-radius: 999px; background: #e8eef3; overflow: hidden; }
    .roi-track span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--green)); }
    .layout { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(320px, .55fr); gap: 14px; }
    .card { padding: 16px; }
    .trend-card, .compare-card { min-height: 360px; }
    .ltv-panel { min-height: 250px; }
    svg { display: block; width: 100%; height: auto; overflow: visible; }
    .axis { stroke: var(--line-strong); stroke-width: 1; }
    .gridline { stroke: #e8eef3; stroke-width: 1; }
    .bar { fill: var(--blue); opacity: .9; }
    .bar.trend-cost { fill: var(--blue); opacity: .88; }
    .bar.good { fill: var(--green); }
    .bar.bad { fill: var(--red); }
    .line {
      fill: none; stroke: var(--ink); stroke-width: 2.4;
      stroke-linejoin: round; stroke-linecap: round;
    }
    .line.trend-roi, .line.ratio-1 { stroke: var(--red); }
    .line.pay-rate { stroke: var(--pay-rate); }
    .line.ratio-2 { stroke: var(--green); }
    .line.ratio-3 { stroke: var(--gold); }
    .line.ratio-4 { stroke: var(--violet); }
    .line.ratio-5 { stroke: #8a6a38; }
    .line.ratio-6 { stroke: #5177b8; }
    .line.ratio-7 { stroke: #6c8b4d; }
    .line.ratio-8 { stroke: #a4607c; }
    .line.ratio-9 { stroke: #4f8d8a; }
    .area { opacity: .32; stroke: none; }
    .area.ratio-1 { fill: var(--red-soft); }
    .area.ratio-2 { fill: var(--green-soft); }
    .area.ratio-3 { fill: var(--gold-soft); }
    .area.ratio-4 { fill: var(--violet-soft); }
    .area.ratio-5 { fill: #efe5d4; }
    .area.ratio-6 { fill: #e3eafa; }
    .area.ratio-7 { fill: #e8efd9; }
    .area.ratio-8 { fill: #f2e2ea; }
    .area.ratio-9 { fill: #dff0ef; }
    .dot {
      fill: var(--paper); stroke: var(--ink); stroke-width: 2;
    }
    .dot.trend-roi, .dot.ratio-1 { stroke: var(--red); }
    .dot.pay-rate { stroke: var(--pay-rate); fill: var(--pay-rate-soft); }
    .dot.ratio-2 { stroke: var(--green); }
    .dot.ratio-3 { stroke: var(--gold); }
    .dot.ratio-4 { stroke: var(--violet); }
    .dot.ratio-5 { stroke: #8a6a38; }
    .dot.ratio-6 { stroke: #5177b8; }
    .dot.ratio-7 { stroke: #6c8b4d; }
    .dot.ratio-8 { stroke: #a4607c; }
    .dot.ratio-9 { stroke: #4f8d8a; }
    .tick-label {
      fill: var(--muted); font-size: 11px; font-weight: 650;
    }
    .value-label {
      fill: var(--ink); font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums;
    }
    .legend {
      display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px;
      margin-top: 8px; padding-top: 9px; border-top: 1px solid var(--line);
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; background: var(--red); }
    .swatch.green { background: var(--green); }
    .swatch.pay-rate { background: var(--pay-rate); }
    .swatch.orange { background: var(--gold); }
    .swatch.purple { background: var(--violet); }
    .swatch.brown { background: #8a6a38; }
    .swatch.steel { background: #5177b8; }
    .swatch.olive { background: #6c8b4d; }
    .swatch.rose { background: #a4607c; }
    .swatch.teal { background: #4f8d8a; }
    .swatch.trend-roi { background: var(--red); }
    .swatch.trend-cost { background: var(--blue); }
    .monthly-roi-card { display: grid; gap: 12px; overflow: hidden; }
    .monthly-roi-head { display: grid; grid-template-columns: minmax(180px, max-content) minmax(0, 1fr); gap: 12px; align-items: start; }
    .monthly-roi-controls { display: grid; grid-template-columns: repeat(3, minmax(120px, 1fr)); gap: 8px; min-width: 0; }
    .monthly-roi-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, .9fr); gap: 12px; align-items: start; }
    .monthly-roi-chart { min-height: 310px; }
    .monthly-roi-table-wrap { max-height: 420px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
    table.monthly-roi-table { min-width: 1180px; }
    .monthly-roi-table .freeze-col-1, .monthly-roi-table .freeze-col-2, .monthly-roi-table .freeze-col-3 {
      position: sticky; background: inherit; box-sizing: border-box; z-index: 2;
    }
    .monthly-roi-table .freeze-col-1 { left: 0; width: 104px; min-width: 104px; }
    .monthly-roi-table .freeze-col-2 { left: 104px; width: 80px; min-width: 80px; }
    .monthly-roi-table .freeze-col-3 { left: 184px; width: 96px; min-width: 96px; box-shadow: 1px 0 0 #d9e3ec; }
    .monthly-roi-table th.freeze-col-1, .monthly-roi-table th.freeze-col-2, .monthly-roi-table th.freeze-col-3 { z-index: 3; background: #f5f8fb; }
    .tables { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
    .table-card { padding: 0; overflow: hidden; }
    .table-card .section-title {
      grid-template-columns: minmax(120px, max-content) minmax(0, 1fr);
      align-items: start; padding: 14px 16px 10px; margin: 0; border-bottom: 1px solid var(--line);
    }
    .table-filters {
      display: grid; grid-template-columns: repeat(3, minmax(104px, 1fr)); align-items: end;
      justify-content: end; gap: 8px; min-width: 0;
    }
    .table-filters label { width: 100%; }
    .table-card .caption { grid-column: 1 / -1; text-align: left; padding-top: 2px; }
    .table-wrap { width: 100%; max-width: 100%; overflow-x: auto; }
    .region-table-wrap, .campaign-table-wrap { max-height: 620px; overflow: auto; overscroll-behavior: contain; }
    table {
      width: 100%; min-width: 1360px; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums;
    }
    th, td { padding: 8px 8px; border-bottom: 1px solid #e6edf3; vertical-align: top; }
    th {
      position: sticky; top: 0; z-index: 1; text-align: left; color: #59677c;
      background: #f5f8fb; font-weight: 800; white-space: nowrap;
    }
    tbody tr:nth-child(even) td { background: #fafcfd; }
    tbody tr:hover td { background: #f1f7f9; }
    .detail-table .freeze-col-1,
    .detail-table .freeze-col-2,
    .detail-table .freeze-col-3,
    .detail-table .freeze-col-4,
    .detail-table .freeze-col-5 {
      position: sticky;
      background: inherit;
      box-sizing: border-box;
      z-index: 2;
    }
    .detail-table th.freeze-col-1,
    .detail-table th.freeze-col-2,
    .detail-table th.freeze-col-3,
    .detail-table th.freeze-col-4,
    .detail-table th.freeze-col-5 {
      z-index: 4;
      background: #f5f8fb;
    }
    .detail-table tbody .freeze-col-1,
    .detail-table tbody .freeze-col-2,
    .detail-table tbody .freeze-col-3,
    .detail-table tbody .freeze-col-4,
    .detail-table tbody .freeze-col-5 { background: #fff; }
    .detail-table tbody tr:nth-child(even) .freeze-col-1,
    .detail-table tbody tr:nth-child(even) .freeze-col-2,
    .detail-table tbody tr:nth-child(even) .freeze-col-3,
    .detail-table tbody tr:nth-child(even) .freeze-col-4,
    .detail-table tbody tr:nth-child(even) .freeze-col-5 { background: #fafcfd; }
    .detail-table tbody tr:hover .freeze-col-1,
    .detail-table tbody tr:hover .freeze-col-2,
    .detail-table tbody tr:hover .freeze-col-3,
    .detail-table tbody tr:hover .freeze-col-4,
    .detail-table tbody tr:hover .freeze-col-5 { background: #f1f7f9; }
    .region-detail-table.freeze-4 .freeze-col-1 { left: 0; width: 88px; min-width: 88px; }
    .region-detail-table.freeze-4 .freeze-col-2 { left: 88px; width: 88px; min-width: 88px; }
    .region-detail-table.freeze-4 .freeze-col-3 { left: 176px; width: 96px; min-width: 96px; }
    .region-detail-table.freeze-4 .freeze-col-4 { left: 272px; width: 112px; min-width: 112px; box-shadow: 1px 0 0 #d9e3ec; }
    .region-detail-table.freeze-5 .freeze-col-1 { left: 0; width: 104px; min-width: 104px; }
    .region-detail-table.freeze-5 .freeze-col-2 { left: 104px; width: 88px; min-width: 88px; }
    .region-detail-table.freeze-5 .freeze-col-3 { left: 192px; width: 96px; min-width: 96px; }
    .region-detail-table.freeze-5 .freeze-col-4 { left: 288px; width: 96px; min-width: 96px; }
    .region-detail-table.freeze-5 .freeze-col-5 { left: 384px; width: 112px; min-width: 112px; box-shadow: 1px 0 0 #d9e3ec; }
    .campaign-detail-table .freeze-col-1 { left: 0; width: 310px; min-width: 310px; }
    .campaign-detail-table .freeze-col-2 { left: 310px; width: 88px; min-width: 88px; }
    .campaign-detail-table .freeze-col-3 { left: 398px; width: 96px; min-width: 96px; }
    .campaign-detail-table .freeze-col-4 { left: 494px; width: 112px; min-width: 112px; box-shadow: 1px 0 0 #d9e3ec; }
    .monthly-roi-table tbody .freeze-col-1,
    .monthly-roi-table tbody .freeze-col-2,
    .monthly-roi-table tbody .freeze-col-3 { background: #fff; }
    .monthly-roi-table tbody tr:nth-child(even) .freeze-col-1,
    .monthly-roi-table tbody tr:nth-child(even) .freeze-col-2,
    .monthly-roi-table tbody tr:nth-child(even) .freeze-col-3 { background: #fafcfd; }
    .monthly-roi-table tbody tr:hover .freeze-col-1,
    .monthly-roi-table tbody tr:hover .freeze-col-2,
    .monthly-roi-table tbody tr:hover .freeze-col-3 { background: #f1f7f9; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .nowrap { white-space: nowrap; }
    .campaign { max-width: 310px; word-break: break-word; font-weight: 700; }
    @media (max-width: 1260px) {
      .controls { grid-template-columns: repeat(4, minmax(118px, 1fr)); }
      .kpis, .monthly-roi-grid, .tables { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      .page { padding: 14px 10px 26px; }
      .topbar, .controls, .kpis, .roi-icons, .monthly-roi-head, .monthly-roi-controls, .monthly-roi-grid, .tables { grid-template-columns: 1fr; }
      h1 { max-width: 14ch; }
      .section-title, .table-card .section-title { grid-template-columns: 1fr; }
      .caption { text-align: left; }
      .metric-card { grid-template-columns: minmax(0, 1fr); }
      .metric-spark { grid-column: 1; grid-row: auto; }
      .table-filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#dashboard">跳到仪表盘</a>
  <main class="page" id="dashboard">
    <section class="topbar" aria-labelledby="pageTitle">
      <div class="masthead">
        <span class="eyebrow">投放数据</span>
        <h1 id="pageTitle">Meetar 仪表盘</h1>
        <div id="subTitle" class="sub">加载中</div>
      </div>
      <div class="controls">
        <label>日期<select id="dateSelect"></select></label>
        <label>范围<select id="dateModeSelect">
          <option value="single">单日</option><option value="yesterday">前一日</option>
          <option value="last7">近7日</option><option value="last14">近14日</option>
          <option value="month">当月</option><option value="lastMonth">上月</option>
          <option value="custom">自定义</option>
        </select></label>
        <label>对比<select id="compareModeSelect">
          <option value="dayCompare">两日环比</option><option value="weekCompare">周环比</option><option value="monthCompare">月环比</option>
        </select></label>
        <label>apm<select id="apmSelect"></select></label>
        <label>媒体<select id="mediaSelect"></select></label>
        <label>国家<select id="countrySelect"></select></label>
        <label id="customStartLabel" class="is-hidden">开始<input id="startDateInput" type="date"></label>
        <label id="customEndLabel" class="is-hidden">结束<input id="endDateInput" type="date"></label>
      </div>
    </section>
    <p id="note" class="note">正在加载数据…</p>
    <div class="board">
      <section class="section-shell" aria-labelledby="metricsTitle">
        <div class="section-title">
          <h2 id="metricsTitle">核心概览</h2>
          <span class="caption" id="kpiCaption"></span>
        </div>
        <section class="kpis" id="kpis" aria-label="关键指标"></section>
      </section>

      <section class="section-shell" aria-labelledby="roiTitle">
        <div class="section-title">
          <h2 id="roiTitle">ROI 阶段</h2>
          <span class="caption" id="roiCaption"></span>
        </div>
        <section class="roi-icons" id="roiIcons" aria-label="ROI指标"></section>
      </section>

      <section class="section-shell" aria-labelledby="trendTitle">
        <div class="section-title">
          <h2 id="trendTitle">趋势</h2>
          <span class="caption">费用 / ROI / 首充率</span>
        </div>
        <div class="layout">
          <section class="card trend-card">
            <div id="trendChart"></div>
          </section>
          <section class="card compare-card">
            <div class="section-title" style="margin-bottom:8px">
              <h2 id="dodTitle">环比分析</h2>
              <span class="caption" id="dodCaption"></span>
            </div>
            <div id="dodChart"></div>
          </section>
        </div>
      </section>

      <section class="section-shell" aria-labelledby="ltvTitle">
        <div class="section-title">
          <h2 id="ltvTitle">LTV 阶段倍率</h2>
          <span class="caption">从 LTV0 到 LTV120</span>
        </div>
        <section class="card ltv-panel" id="ltvChart"></section>
      </section>

      <section class="section-shell" aria-labelledby="monthlyRoiTitle">
        <div class="section-title">
          <h2 id="monthlyRoiTitle">国家分月 ROI</h2>
          <span class="caption" id="monthlyRoiCaption"></span>
        </div>
        <section class="card monthly-roi-card">
          <div class="monthly-roi-head">
            <div class="monthly-roi-controls">
              <label>模式<select id="monthlyRoiMode"><option value="country">按国家</option><option value="month">按月份</option></select></label>
              <label>月份<select id="monthlyRoiMonth"></select></label>
              <label>国家<select id="monthlyRoiCountry"></select></label>
            </div>
            <label>指标<select id="monthlyRoiMetric"></select></label>
          </div>
          <div class="monthly-roi-grid">
            <div class="monthly-roi-chart" id="monthlyRoiChart"></div>
            <div class="monthly-roi-table-wrap"><table class="monthly-roi-table" id="monthlyRoiTable"></table></div>
          </div>

      </section>

      <section class="section-shell" aria-labelledby="tablesTitle">
        <div class="section-title">
          <h2 id="tablesTitle">国家渠道 / 广告系列明细</h2>
          <span class="caption">按当前日期范围和筛选统计</span>
        </div>
        <div class="tables">
          <section class="card table-card">
            <div class="section-title">
              <h2>国家渠道明细</h2>
              <div class="table-filters">
                <label>排序<select id="metricSelect"></select></label>
                <label>apm<select id="regionApmSelect"></select></label>
                <label>媒体<select id="regionMediaSelect"></select></label>
                <label>国家<select id="regionCountrySelect"></select></label>
                <label>周期<select id="regionPeriodSelect"><option value="last3">近3日</option><option value="last7">近7日</option><option value="month">当月</option><option value="lastMonth">上月</option><option value="custom">自定义</option></select></label>
                <label>开始<input id="regionDateStart" type="date"></label>
                <label>结束<input id="regionDateEnd" type="date"></label>
              </div>
              <span class="caption" id="regionCaption"></span>
            </div>
            <div class="table-wrap region-table-wrap"><table id="regionTable" class="detail-table region-detail-table"></table></div>
          </section>
          <section class="card table-card">
            <div class="section-title">
              <h2>广告系列明细</h2>
              <div class="table-filters">
                <label>apm<select id="campaignApmSelect"></select></label>
                <label>媒体<select id="campaignMediaSelect"></select></label>
                <label>国家<select id="campaignCountrySelect"></select></label>
                <label>开始<input id="campaignDateStart" type="date"></label>
                <label>结束<input id="campaignDateEnd" type="date"></label>
              </div>
              <span class="caption" id="campaignCaption"></span>
            </div>

          </section>
        </div>
      </section>
    </div>
  </main>

  <script>
    let DATA = null;
    const fmtNum = new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 0 });
    const fmtMoney = new Intl.NumberFormat('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmtSmall = new Intl.NumberFormat('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const pct = v => v === null || v === undefined ? '' : `${(v * 100).toFixed(2)}%`;
    const money = v => v === null || v === undefined ? '' : fmtMoney.format(v);
    const num = v => v === null || v === undefined ? '' : fmtNum.format(v);
    const small = v => v === null || v === undefined ? '' : fmtSmall.format(v);
    const byId = id => document.getElementById(id);
    let dates = [];
    let dateSet = new Set();
    const LTV_STAGES = [0, 1, 3, 7, 14, 30, 60, 90, 120];
    const LTV_COLUMNS = LTV_STAGES.map(v => `ltv${v}`);
    const ROI_METRICS = ['首日ROI', ...LTV_STAGES.filter(v => v !== 0).map(v => `ROI${v}`)];
    const LTV_RATIO_METRICS = ['LTV1/LTV0', 'LTV3/LTV1', 'LTV7/LTV3', 'LTV14/LTV7', 'LTV30/LTV14', 'LTV60/LTV30', 'LTV90/LTV60', 'LTV120/LTV90'];
    const ENCRYPTED_DATA_URL = 'dashboard-data.enc';
    const PBKDF2_ITERATIONS = 200000;
    const monthKey = d => d ? d.slice(0, 7) : '';
    const previousMonthKey = d => {
      const [y, m] = monthKey(d).split('-').map(Number);
      const prev = new Date(y, m - 2, 1);
      return `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, '0')}`;
    };
    const previousDateFor = d => { const i = dates.indexOf(d); return i > 0 ? dates[i - 1] : null; };
    const normalizeDateInput = (value, fallback) => dateSet.has(value) ? value : fallback;
    const addDays = (value, days) => { const dt = new Date(`${value}T00:00:00`); dt.setDate(dt.getDate() + days); return dt.toISOString().slice(0, 10); };
    const monthBounds = month => ({ start: `${month}-01`, end: new Date(Number(month.slice(0, 4)), Number(month.slice(5, 7)), 0).toISOString().slice(0, 10) });
    const availableDatesBetween = (start, end) => dates.filter(d => d >= start && d <= end);
    const utf8 = value => new TextEncoder().encode(value);
    const bytesToText = bytes => new TextDecoder().decode(bytes);
    function base64ToBytes(base64) {
      const text = atob(base64.replace(/\s+/g, ''));
      const bytes = new Uint8Array(text.length);
      for (let i = 0; i < text.length; i += 1) bytes[i] = text.charCodeAt(i);
      return bytes;
    }
    async function decryptDashboardPayload(cipherText, passphrase) {
      const bytes = base64ToBytes(cipherText);
      const header = bytes.subarray(0, 8);
      if (bytes.length < 16 || bytesToText(header) !== 'Salted__') {
        throw new Error('加密文件格式不正确');
      }
      const salt = bytes.subarray(8, 16);
      const encrypted = bytes.subarray(16);
      const material = await crypto.subtle.importKey('raw', utf8(passphrase), 'PBKDF2', false, ['deriveBits']);
      const derived = await crypto.subtle.deriveBits({
        name: 'PBKDF2',
        salt,
        iterations: PBKDF2_ITERATIONS,
        hash: 'SHA-256'
      }, material, 48 * 8);
      const keyBytes = derived.slice(0, 32);
      const iv = derived.slice(32, 48);
      const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-CBC' }, false, ['decrypt']);
      const plainBuffer = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, key, encrypted);
      return JSON.parse(bytesToText(new Uint8Array(plainBuffer)));
    }
    async function loadDashboardData() {
      const cachedPassphrase = sessionStorage.getItem('meetar.dashboard.passphrase') || '';
      let passphrase = cachedPassphrase;
      for (let attempt = 0; attempt < 3; attempt += 1) {
        if (!passphrase) {
          passphrase = window.prompt('请输入仪表盘解密口令');
        }
        if (!passphrase) return null;
        try {
          const response = await fetch(`${ENCRYPTED_DATA_URL}?ts=${Date.now()}`, { cache: 'no-store' });
          if (!response.ok) throw new Error(`数据加载失败：${response.status}`);
          const cipherText = await response.text();
          const data = await decryptDashboardPayload(cipherText, passphrase);
          sessionStorage.setItem('meetar.dashboard.passphrase', passphrase);
          return data;
        } catch (error) {
          passphrase = '';
          sessionStorage.removeItem('meetar.dashboard.passphrase');
          if (attempt === 2) throw error;
        }
      }
      return null;
    }
    function currentRange() {
      const mode = byId('dateModeSelect').value;
      const selected = byId('dateSelect').value || dates[dates.length - 1];
      const idx = Math.max(0, dates.indexOf(selected));
      if (mode === 'yesterday') {
        const prev = previousDateFor(selected);
        return prev ? { start: prev, end: prev } : { empty: true, label: `${selected} 无前一日数据` };
      }
      if (mode === 'last7') return { start: dates[Math.max(0, idx - 6)], end: selected };
      if (mode === 'last14') return { start: dates[Math.max(0, idx - 13)], end: selected };
      if (mode === 'month') {
        const monthDates = dates.filter(d => monthKey(d) === monthKey(selected) && d <= selected);
        return monthDates.length ? { start: monthDates[0], end: monthDates[monthDates.length - 1] } : { empty: true, label: `${monthKey(selected)} 无数据` };
      }
      if (mode === 'lastMonth') {
        const prevMonth = previousMonthKey(selected);
        const monthDates = dates.filter(d => monthKey(d) === prevMonth);
        return monthDates.length ? { start: monthDates[0], end: monthDates[monthDates.length - 1] } : { empty: true, label: `${prevMonth} 无数据` };
      }
      if (mode === 'custom') {
        let start = normalizeDateInput(byId('startDateInput').value, dates[0]);
        let end = normalizeDateInput(byId('endDateInput').value, selected);
        if (start > end) [start, end] = [end, start];
        return { start, end };
      }
      return { start: selected, end: selected };
    }
    function datesInCurrentRange() {
      const range = currentRange();
      return range.empty ? [] : dates.filter(d => d >= range.start && d <= range.end);
    }
    function currentFilters() {
      return {
        apm: byId('apmSelect').value || '全部',
        media: byId('mediaSelect').value || '全部',
        country: byId('countrySelect').value || '全部'
      };
    }
    function passesFilters(row, filters) {
      return (filters.apm === '全部' || row.apm === filters.apm) &&
        (filters.media === '全部' || row['媒体类型'] === filters.media) &&
        (filters.country === '全部' || row['国家'] === filters.country);
    }
    function aggregateRows(rows) {
      const out = { '费用': 0, '进入首页设备数': 0, '首日充值人数': 0, __has: {} };
      for (const col of LTV_COLUMNS) out[col] = 0;
      for (const r of rows) {
        out['费用'] += r['费用'] || 0;
        out['进入首页设备数'] += r['进入首页设备数'] || 0;
        out['首日充值人数'] += r['首日充值人数'] || 0;
        for (const col of LTV_COLUMNS) {
          if (r[col] !== null && r[col] !== undefined) {
            out[col] += r[col] || 0;
            out.__has[col] = true;
          }
        }
      }
      out['进入首页设备成本'] = out['进入首页设备数'] ? out['费用'] / out['进入首页设备数'] : null;
      out['首日充值成本'] = out['首日充值人数'] ? out['费用'] / out['首日充值人数'] : null;
      out['首日充值率'] = out['进入首页设备数'] ? out['首日充值人数'] / out['进入首页设备数'] : null;
      out['首日ROI'] = out['费用'] && out.__has.ltv0 ? out.ltv0 / out['费用'] : null;
      for (const stage of LTV_STAGES.filter(v => v !== 0)) {
        out[`ROI${stage}`] = out['费用'] && out.__has[`ltv${stage}`] ? out[`ltv${stage}`] / out['费用'] : null;
      }
      const ratio = (name, a, b) => out[name] = out.__has[a] && out.__has[b] && out[b] ? out[a] / out[b] : null;
      ratio('LTV1/LTV0', 'ltv1', 'ltv0');
      ratio('LTV3/LTV1', 'ltv3', 'ltv1');
      ratio('LTV7/LTV3', 'ltv7', 'ltv3');
      ratio('LTV14/LTV7', 'ltv14', 'ltv7');
      ratio('LTV30/LTV14', 'ltv30', 'ltv14');
      ratio('LTV60/LTV30', 'ltv60', 'ltv30');
      ratio('LTV90/LTV60', 'ltv90', 'ltv60');
      ratio('LTV120/LTV90', 'ltv120', 'ltv90');
      delete out.__has;
      return out;
    }
    function filteredDetail(date = null) {
      const filters = currentFilters();
      return DATA.detail.filter(r => (!date || r['时间'] === date) && passesFilters(r, filters));
    }
    function filteredDetailForDates(dateList, filters = currentFilters()) {
      const allowed = new Set(dateList);
      return DATA.detail.filter(r => allowed.has(r['时间']) && passesFilters(r, filters));
    }
    function currentPeriodRows() { return filteredDetailForDates(datesInCurrentRange()); }
    function comparisonPeriod() {
      const range = currentRange();
      if (range.empty || !range.end) return null;
      const compareMode = byId('compareModeSelect').value || 'dayCompare';
      if (compareMode === 'weekCompare') {
        const currentBounds = monthBounds(range.end.slice(0, 7));
        const currentStart = addDays(currentBounds.end, -6);
        const previousBounds = { start: addDays(currentStart, -7), end: addDays(currentBounds.end, -7) };
        return {
          title: '周环比',
          currentDates: availableDatesBetween(currentStart, currentBounds.end),
          previousDates: availableDatesBetween(previousBounds.start, previousBounds.end),
          caption: `${previousBounds.start} 至 ${previousBounds.end} → ${currentStart} 至 ${currentBounds.end}`
        };
      }
      if (compareMode === 'monthCompare') {
        const currentMonth = monthKey(range.end);
        const previousMonth = previousMonthKey(range.end);
        const currentBounds = monthBounds(currentMonth);
        const previousBounds = monthBounds(previousMonth);
        return {
          title: '月环比',
          currentDates: availableDatesBetween(currentBounds.start, currentBounds.end),
          previousDates: availableDatesBetween(previousBounds.start, previousBounds.end),
          caption: `${previousMonth} → ${currentMonth}`
        };
      }
      const prevDate = previousDateFor(range.end);
      return {
        title: '两日环比',
        currentDates: range.end ? [range.end] : [],
        previousDates: prevDate ? [prevDate] : [],
        caption: range.end ? (prevDate ? `${prevDate} → ${range.end}` : `${range.end} 无前一日`) : '无可比日期'
      };
    }
    function deltaForPeriod(metric, period = comparisonPeriod()) {
      if (!period || !period.previousDates.length || !period.currentDates.length) return null;
      const prev = aggregateRows(filteredDetailForDates(period.previousDates));
      const curr = aggregateRows(filteredDetailForDates(period.currentDates));
      const p = prev[metric];
      if (p === null || p === undefined || p === 0) return null;
      return ((curr[metric] || 0) - p) / p;
    }
    function deltaClass(metric, value) {
      if (value === null || value === undefined) return '';
      const lowerIsBetter = metric.includes('成本') || metric === '费用';
      return value === 0 ? '' : (lowerIsBetter ? (value < 0 ? 'good' : 'bad') : (value > 0 ? 'good' : 'bad'));
    }
    function sparkline(metric, cls = '') {
      const series = datesInCurrentRange().map(date => ({ 时间: date, ...aggregateRows(filteredDetail(date)) }));
      if (!series.length) return '<div class="caption">无数据</div>';
      const w = 132, h = 54, pad = 5;
      const values = series.map(d => d[metric]).filter(v => v !== null && v !== undefined);
      const minVal = Math.min(...values, 0), maxVal = Math.max(...values, 1);
      const xFor = i => pad + i * ((w - pad * 2) / (series.length - 1 || 1));
      const yFor = v => h - pad - ((v || 0) - minVal) / (maxVal - minVal || 1) * (h - pad * 2);
      const points = series.map((d, i) => [xFor(i), yFor(d[metric] || 0), d]);
      const path = points.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
      const base = h - pad;
      const area = `M${points[0][0].toFixed(1)},${base} L` + points.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' L') + ` L${points[points.length - 1][0].toFixed(1)},${base} Z`;
      return `<svg class="metric-spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path class="spark-area" d="${area}"></path><path class="spark-line ${cls}" d="${path}"></path></svg>`;
    }
    function renderKpis() {
      const row = aggregateRows(filteredDetailForDates(datesInCurrentRange()));
      const period = comparisonPeriod();
      const deltaLabel = period?.title || '环比';
      const metrics = [
        ['费用', money(row['费用']), '费用', 'cost'],
        ['进入首页设备数', num(row['进入首页设备数']), '进入首页设备数', 'goodline'],
        ['首日充值人数', num(row['首日充值人数']), '首日充值人数', 'goodline'],
        ['进入首页设备成本', money(row['进入首页设备成本']) || '-', '进入首页设备成本', 'badline'],
        ['首日充值成本', money(row['首日充值成本']) || '-', '首日充值成本', 'badline'],
        ['首日充值率', pct(row['首日充值率']) || '-', '首日充值率', 'goodline'],
        ['首日ROI', pct(row['首日ROI']) || '-', '首日ROI', 'goodline'],
        ['ROI30', pct(row['ROI30']) || '-', 'ROI30', 'goodline']
      ];
      byId('kpis').innerHTML = metrics.map(([label, value, rawMetric, sparkClass]) => {
        const d = deltaForPeriod(rawMetric, period);
        const cls = deltaClass(rawMetric, d);
        return `<article class="metric-card ${cls}" data-metric="${rawMetric}"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="delta ${cls}"><span>${deltaLabel}</span><strong>${pct(d) || '-'}</strong></div>${sparkline(rawMetric, sparkClass)}</article>`;
      }).join('');
      byId('kpiCaption').textContent = period?.caption || '';
    }
    function renderRoiIcons() {
      const row = aggregateRows(filteredDetailForDates(datesInCurrentRange()));
      const period = comparisonPeriod();
      const deltaLabel = period?.title || '环比';
      const labels = ROI_METRICS.map(metric => [metric, metric]);
      const values = labels.map(([, metric]) => row[metric]).filter(v => v !== null && v !== undefined);
      const maxValue = Math.max(...values, 0.01);
      byId('roiIcons').innerHTML = labels.map(([label, metric]) => {
        const d = deltaForPeriod(metric, period);
        const cls = deltaClass(metric, d);
        const value = row[metric] || 0;
        const width = Math.max(3, Math.min(100, value / maxValue * 100));
        return `<article class="roi-stage ${cls}"><div class="roi-stage-head"><span>${label}</span><strong>${pct(row[metric]) || '-'}</strong></div><div class="roi-track"><span style="width:${width.toFixed(1)}%"></span></div><div class="delta ${cls}"><span>${deltaLabel}</span><strong>${pct(d) || '-'}</strong></div></article>`;
      }).join('');
      byId('roiCaption').textContent = period?.caption || '';
    }
    function renderTrend() {
      const series = datesInCurrentRange().map(date => ({ 时间: date, ...aggregateRows(filteredDetail(date)) }));
      if (!series.length) { byId('trendChart').innerHTML = '<div class="caption">当前筛选无数据</div>'; return; }
      const w = 920, h = 330, pad = { l: 56, r: 36, t: 24, b: 54 };
      const innerW = w - pad.l - pad.r, innerH = h - pad.t - pad.b, gap = 5;
      const costs = series.map(d => d['费用'] || 0);
      const rois = series.map(d => d['首日ROI'] || 0);
      const payRates = series.map(d => d['首日充值率'] || 0);
      const maxCost = Math.max(...costs, 1);
      const maxRate = Math.max(...rois, ...payRates, 0.01);
      const barW = Math.max(8, innerW / series.length - gap);
      const bars = series.map((d, i) => {
        const x = pad.l + i * (innerW / series.length) + gap / 2;
        const y = pad.t + innerH - (d['费用'] || 0) / maxCost * innerH;
        const bh = pad.t + innerH - y;
        return `<rect class="bar trend-cost" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}"><title>${d['时间']} 费用 ${money(d['费用'])}</title></rect>`;
      }).join('');
      const pointsFor = metric => series.map((d, i) => {
        const x = pad.l + i * (innerW / (series.length - 1 || 1));
        const y = pad.t + innerH - (d[metric] || 0) / maxRate * innerH;
        return [x, y, d];
      });
      const lineFor = (metric, lineClass, dotClass, label) => {
        const points = pointsFor(metric);
        const path = points.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
        const dots = points.map(p => `<circle class="dot ${dotClass}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4"><title>${p[2]['时间']} ${label} ${pct(p[2][metric])}</title></circle>`).join('');
        return `<path class="line ${lineClass}" d="${path}"></path>${dots}`;
      };
      const labels = series.map((d, i) => {
        if (i % 2 && i !== series.length - 1) return '';
        const x = pad.l + i * (innerW / (series.length - 1 || 1));
        return `<text class="tick-label" x="${x.toFixed(1)}" y="${h - 20}" text-anchor="middle">${d['时间'].slice(5)}</text>`;
      }).join('');
      byId('trendChart').innerHTML = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="分日费用、首日ROI和首日充值率趋势图"><line class="axis" x1="${pad.l}" y1="${pad.t + innerH}" x2="${w - pad.r}" y2="${pad.t + innerH}"></line><line class="axis" x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t + innerH}"></line><text class="tick-label" x="8" y="${pad.t + 4}">费用</text><text class="tick-label" x="${w - 92}" y="${pad.t + 4}">比率最高 ${pct(maxRate)}</text>${bars}${lineFor('首日ROI', 'trend-roi', 'trend-roi', '首日 ROI')}${lineFor('首日充值率', 'pay-rate', 'pay-rate', '首日充值率')}${labels}</svg><div class="legend"><span><i class="swatch trend-cost"></i>费用</span><span><i class="swatch trend-roi"></i>首日ROI</span><span><i class="swatch pay-rate"></i>首日充值率</span></div>`;
    }
    function renderDod() {
      const period = comparisonPeriod();
      const metrics = ['费用', '进入首页设备数', '首日充值人数', '进入首页设备成本', '首日充值成本', '首日充值率', '首日ROI'];
      const rows = metrics.map(m => ({ '指标': m, '环比': deltaForPeriod(m, period) }));
      const w = 500, h = 300, pad = { l: 142, r: 76, t: 18, b: 22 };
      const vals = rows.map(r => r['环比']).filter(v => v !== null && v !== undefined);
      const maxAbs = Math.max(...vals.map(v => Math.abs(v)), 0.01);
      const mid = pad.l + (w - pad.l - pad.r) / 2;
      const rowH = (h - pad.t - pad.b) / rows.length;
      const bars = rows.map((r, i) => {
        const y = pad.t + i * rowH + 8;
        const v = r['环比'];
        const len = v === null || v === undefined ? 0 : Math.abs(v) / maxAbs * ((w - pad.l - pad.r) / 2);
        const x = v >= 0 ? mid : mid - len;
        const perf = deltaClass(r['指标'], v);
        const cls = perf ? `bar ${perf}` : 'bar';
        return `<text class="tick-label" x="4" y="${y + 14}">${r['指标']}</text><rect class="${cls}" x="${x.toFixed(1)}" y="${y}" width="${len.toFixed(1)}" height="18"></rect><text class="value-label ${perf}" x="${w - 8}" y="${y + 14}" text-anchor="end">${pct(v) || '-'}</text>`;
      }).join('');
      byId('dodChart').innerHTML = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="核心指标环比"><line class="axis" x1="${mid}" y1="${pad.t}" x2="${mid}" y2="${h - pad.b}"></line>${bars}</svg>`;
      byId('dodTitle').textContent = period?.title || '环比分析';
      byId('dodCaption').textContent = period?.caption || '无可比日期';
    }
    function renderLtvTrend() {
      const series = datesInCurrentRange().map(date => ({ 时间: date, ...aggregateRows(filteredDetail(date)) }));
      if (!series.length) { byId('ltvChart').innerHTML = '<div class="caption">当前筛选无数据</div>'; return; }
      const w = 920, h = 230, pad = { l: 64, r: 28, t: 18, b: 38 };
      const values = series.flatMap(d => LTV_RATIO_METRICS.map(m => d[m]).filter(v => v !== null && v !== undefined));
      const maxVal = Math.max(...values, 1);

      const roiMetricOptions = ROI_METRICS.map(m => `<option value="${m}">${metricLabel(m)}</option>`).join('') + LTV_RATIO_METRICS.map(m => `<option value="${m}">${m}</option>`).join('');
      monthlyRoiMonth.innerHTML = months.map(v => `<option value="${v}">${v}</option>`).join('');
      monthlyRoiCountry.innerHTML = countries.filter(v => v !== '全部').map(v => `<option value="${v}">${v}</option>`).join('');
      monthlyRoiMetric.innerHTML = roiMetricOptions;
      metricSelect.innerHTML = ['费用', '进入首页设备数', '首日充值人数', '进入首页设备成本', '首日充值成本', '首日充值率', '首日ROI', 'ROI1', 'ROI3', 'ROI7', 'ROI14', 'ROI30', 'ROI60', 'ROI90', 'ROI120'].map(v => `<option value="${v}">${v}</option>`).join('');
      monthlyRoiMonth.value = monthKey(DATA.meta.latest_day);
      monthlyRoiMetric.value = 'ROI30';
      dateSelect.value = DATA.meta.latest_day;
      dateModeSelect.value = 'last14';
      compareModeSelect.value = 'dayCompare';
      regionPeriodSelect.value = 'last7';
      metricSelect.value = '费用';
      byId('startDateInput').min = dates[0];
      byId('startDateInput').max = dates[dates.length - 1];
      byId('endDateInput').min = dates[0];
      byId('endDateInput').max = dates[dates.length - 1];
      byId('startDateInput').value = dates[Math.max(0, dates.length - 7)];
      byId('endDateInput').value = DATA.meta.latest_day;
      const tableRangeStart = dates[Math.max(0, dates.length - 7)];
      for (const input of [regionDateStart, regionDateEnd, campaignDateStart, campaignDateEnd]) {
        input.min = dates[0];
        input.max = dates[dates.length - 1];
      }
      regionDateStart.value = tableRangeStart;
      regionDateEnd.value = DATA.meta.latest_day;
      campaignDateStart.value = tableRangeStart;
      campaignDateEnd.value = DATA.meta.latest_day;
      syncRegionPeriodDates();
      const rerender = () => {
        updateCustomControls();
        renderKpis();
        renderRoiIcons();
        renderTrend();
        renderDod();
        renderLtvTrend();
        renderMonthlyRoiAnalysis();
        renderTables();
      };
      dateSelect.addEventListener('change', rerender);
      dateModeSelect.addEventListener('change', rerender);
      compareModeSelect.addEventListener('change', rerender);
      byId('startDateInput').addEventListener('change', rerender);
      byId('endDateInput').addEventListener('change', rerender);
      apmSelect.addEventListener('change', rerender);
      mediaSelect.addEventListener('change', rerender);
      countrySelect.addEventListener('change', rerender);
      monthlyRoiMode.addEventListener('change', renderMonthlyRoiAnalysis);
      monthlyRoiMonth.addEventListener('change', renderMonthlyRoiAnalysis);
      monthlyRoiCountry.addEventListener('change', renderMonthlyRoiAnalysis);
      monthlyRoiMetric.addEventListener('change', renderMonthlyRoiAnalysis);
      metricSelect.addEventListener('change', renderTables);
      regionPeriodSelect.addEventListener('change', () => { syncRegionPeriodDates(); renderTables(); });
      regionDateStart.addEventListener('change', () => { regionPeriodSelect.value = 'custom'; delete regionDateEnd.dataset.periodReference; renderTables(); });
      regionDateEnd.addEventListener('change', () => { if (regionPeriodSelect.value !== 'custom') regionDateEnd.dataset.periodReference = regionDateEnd.value; renderTables(); });
      regionApmSelect.addEventListener('change', renderTables);
      regionMediaSelect.addEventListener('change', renderTables);
      regionCountrySelect.addEventListener('change', renderTables);
      campaignApmSelect.addEventListener('change', renderTables);
      campaignMediaSelect.addEventListener('change', renderTables);
      campaignCountrySelect.addEventListener('change', renderTables);
      campaignDateStart.addEventListener('change', renderTables);
      campaignDateEnd.addEventListener('change', renderTables);
      updateCustomControls();
      rerender();
    }
    function sectionDateList(filters) {
      const selected = normalizeDateInput(filters.referenceEnd || filters.end, dates[dates.length - 1]);
      const selectedIdx = Math.max(0, dates.indexOf(selected));
      if (filters.period === 'last3') return dates.slice(Math.max(0, selectedIdx - 2), selectedIdx + 1);
      if (filters.period === 'last7') return dates.slice(Math.max(0, selectedIdx - 6), selectedIdx + 1);
      if (filters.period === 'month') return dates.filter(date => monthKey(date) === monthKey(selected) && date <= selected);
      if (filters.period === 'lastMonth') return dates.filter(date => monthKey(date) === previousMonthKey(selected));
      let start = normalizeDateInput(filters.start, dates[0]);
      let end = normalizeDateInput(filters.end, dates[dates.length - 1]);
      if (start > end) [start, end] = [end, start];
      return dates.filter(date => date >= start && date <= end);
    }
    async function boot() {
      try {
        DATA = await loadDashboardData();
        if (!DATA) {
          byId('note').textContent = '已取消解密，仪表盘未加载。';
          return;
        }
        dates = DATA.daily.map(d => d['时间']).filter(Boolean).sort();
        dateSet = new Set(dates);
        init();
      } catch (error) {
        console.error(error);
        byId('note').textContent = '数据加载失败，请确认 dashboard-data.enc 已更新并和 index.html 放在同一目录。';
      }
    }
    boot();
  </script>
</body>
